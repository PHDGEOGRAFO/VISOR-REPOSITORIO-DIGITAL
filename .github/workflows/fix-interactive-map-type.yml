name: Corregir tipado del render poligonal

on:
  push:
    paths:
      - '.github/workflows/fix-interactive-map-type.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir tipado de MultiPolygon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/InteractiveMap.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'const polys0=f.geometry.type==="Polygon"?[f.geometry.coordinates]:f.geometry.coordinates;const polys=sampleArray(polys0,maxParts);'
          new = 'const polys0=(f.geometry.type==="Polygon"?[f.geometry.coordinates]:f.geometry.coordinates) as number[][][][];const polys=sampleArray(polys0,maxParts);'
          if old not in s:
              raise SystemExit('No se encontro el bloque esperado; no se modifica el archivo.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit de la correccion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveMap.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Corregir tipado de geometria MultiPolygon"
          git push
