name: Resincronizar GeoPackage VF sanitizados

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resincronizar-gpkg-sanitizados.yml'
      - 'scripts/resync_vf_sanitized.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar GIS y descarga Drive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin sqlite3
          python -m pip install --break-system-packages gdown
      - name: Descargar carpeta VF actual
        run: |
          rm -rf /tmp/vf && mkdir -p /tmp/vf
          gdown --folder 'https://drive.google.com/drive/folders/1BEu1Vy6u8hrmu6r2v5hRE6TKupiaDbP7' -O /tmp/vf
          echo '=== GPKG encontrados ==='
          find /tmp/vf -type f -iname '*.gpkg' -printf '%f %s bytes\n' | sort
          for p in 01 02 03 04 05; do
            test "$(find /tmp/vf -type f \( -iname "${p}_*_VF*.gpkg" -o -iname "${p}-*_VF*.gpkg" \) | wc -l)" -ge 1 || { echo "Falta GeoPackage ${p}"; exit 1; }
          done
      - name: Validar 11 capas corregidas en maestros
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          expected={
            'URB_PTO_DANO_ESTRUCTURAL':60,
            'AMB_PTO_INUNDACION_2024':105,
            'AMB_PTO_RUIDOS_MOLESTOS_2024':23620,
            'SOC_PTO_CLUB_ADULTO_MAYOR':370,
            'SOC_PTO_COMITE_SEGURIDAD':110,
            'SOC_PTO_FACTORES_RIESGO_UTEM':130,
            'SOC_PTO_LABOR_EMERGENCIAS':5543,
            'SOC_PTO_ORGANIZACIONES_SOCIALES':3501,
            'ECO_PTO_APARCADORES_ILEGALES':593,
            'ECO_PTO_BANCOS':67,
            'ECO_PTO_COMERCIO_AMBULANTE_2025':2188,
          }
          found={}
          for gpkg in pathlib.Path('/tmp/vf').rglob('*.gpkg'):
            try:
              con=sqlite3.connect(gpkg)
              for t,n in expected.items():
                row=con.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",(t,)).fetchone()
                if row:
                  c=con.execute(f'SELECT COUNT(*) FROM "{t}"').fetchone()[0]
                  srs=con.execute('SELECT srs_id FROM gpkg_geometry_columns WHERE table_name=?',(t,)).fetchone()
                  if c!=n: raise SystemExit(f'{t}: esperado {n}, encontrado {c}')
                  if not srs or int(srs[0])!=4326: raise SystemExit(f'{t}: CRS no es EPSG:4326')
                  found[t]=str(gpkg)
              con.close()
            except sqlite3.Error:
              pass
          missing=sorted(set(expected)-set(found))
          if missing: raise SystemExit('Faltan capas corregidas: '+', '.join(missing))
          print('11/11 capas corregidas presentes y en EPSG:4326')
          PY
      - name: Ajustar filtro de privacidad y fecha de índice
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/resync_vf_sanitized.py')
          s=p.read_text(encoding='utf-8')
          old="""def sensitive(k):\n n=norm(k).replace(' ','_')\n return any(norm(x).replace(' ','_') in n for x in SENSITIVE)"""
          new="""def sensitive(k):\n n=norm(k).replace(' ','_')\n tokens=[x for x in re.split(r'[^a-z0-9]+',n) if x]\n exact={'rut','run','email','correo','mail','telefono','fono','celular','contacto','responsable','encargado','propietario','propietari','titular','dueno','apellido','nacimiento','clave','password','contrasena','presidente','secretario','tesorero'}\n if any(t in exact for t in tokens): return True\n return n.startswith(('rut_','run_','email_','correo_','fono_','telefono_','celular_','contacto_','responsable_','encargado_','propietario_','propietari_','titular_','dueno_','apellido_','fecha_nac','c__de_id','c_de_id'))"""
          if old not in s: raise SystemExit('No se encontró función sensitive esperada')
          s=s.replace(old,new)
          s=s.replace("cat['generatedAt']='2026-09-03'","cat['generatedAt']='2026-09-04'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Resincronizar GPKG GeoJSON catálogo y capas
        run: python scripts/resync_vf_sanitized.py
      - name: Controles críticos
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('public/data/sociocultural/soc-pto-bibliotecas-vf-2025.geojson')
          if not p.exists(): raise SystemExit('Falta Bibliotecas 2025')
          n=len(json.loads(p.read_text(encoding='utf-8'))['features'])
          if n!=21: raise SystemExit(f'Bibliotecas debe tener 21 registros, tiene {n}')
          page=pathlib.Path('app/page.tsx').read_text(encoding='utf-8')
          if 'Promedio n_per' in page: raise SystemExit('No se permite reintroducir Promedio n_per')
          if 'Suma n_per' not in page: raise SystemExit('Falta Suma n_per')
          if 'soc-pto-bibliotecas-vf-2025.geojson' not in page: raise SystemExit('Bibliotecas no quedó conectada')
          report=json.loads(pathlib.Path('/tmp/resync_report.json').read_text(encoding='utf-8'))
          published=report.get('published',[])
          skipped=report.get('skipped',[])
          if skipped:
            nombres=', '.join(x.get('table','?') for x in skipped)
            raise SystemExit(f'No se permite publicar con capas omitidas por CRS/geometría: {nombres}')
          print('Capas resincronizadas:',len(published))
          print('Capas omitidas:',len(skipped))
          print('Coberturas con campos sensibles omitidos en GeoJSON:',sum(bool(x.get('removed_sensitive')) for x in published))
          print('Bibliotecas:',n)
          PY
          test ! -e public/data/PTO_BIB_2025_001_BIBLIOTECAS_2025.geojson
      - name: Validar build
        run: |
          npm ci
          npx next build --webpack
      - name: Guardar actualización
        run: |
          git config user.name 'PHDGEOGRAFO'
          git config user.email 'phernandezd@gmail.com'
          git add -A app/page.tsx public/data public/catalog/index_coberturas.json
          git status --short
          git commit -m 'GIS: publicar 11 capas depuradas y actualizar índices' || exit 0
          git push

