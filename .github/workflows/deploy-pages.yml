name: Publicar Visor Repositorio Digital

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar correcciones UI y render V2
        run: python scripts/runtime_deploy_patches.py
      - name: Instalar GDAL para descargas por cobertura
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
      - name: Preparar GeoPackage y Shapefile por cobertura
        run: python scripts/prepare_layer_downloads.py
      - run: npm ci
      - run: npx next build --webpack
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

# 2026-09-08: bloqueo temporal de coberturas poligonales complejas y render V2.
