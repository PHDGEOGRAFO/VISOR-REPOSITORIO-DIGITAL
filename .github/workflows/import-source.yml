name: Importar código completo del visor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar respaldo fuente
        run: |
          curl --fail --location --retry 5             https://visor-stgo.phernandezd.chatgpt.site/visor-repositorio-digital-source.zip             --output /tmp/visor-source.zip
          mkdir /tmp/visor-source
          unzip -q /tmp/visor-source.zip -d /tmp/visor-source
      - name: Incorporar código y datos
        run: |
          cp -a /tmp/visor-source/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Traspasar código completo del Visor Repositorio Digital"
          git push
