name: Corregir poligono y buffer
on:
  push:
    paths:
      - 'public/trigger-poligono-buffer.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar y corregir dibujo de poligono
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/InteractiveMap.tsx')
          s=p.read_text()
          old='const common={key:i,onPointerDown:(e:any)=>{e.stopPropagation()},onClick:(e:any)=>{e.stopPropagation();onFeature(f,id)}};'
          new='const common={key:i,onPointerDown:(e:any)=>{if(viz!=="draw")e.stopPropagation()},onClick:(e:any)=>{if(viz==="draw")return;e.stopPropagation();onFeature(f,id)}};'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('No se encontro handler compatible de geometrías')
          p.write_text(s)
          PY
      - name: Corregir radio de buffer dentro del bloque 1
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          bad='<div className="analysisInline"><label>Tipo de análisis<select value={analysis} onChange={e=>setAnalysis(e.target.value)}><option>Cantidad de registros</option><option>Buffer</option><option>Proximidad</option><option>Densidad</option><option>Isócronas</option><option>Suma n_per</option><option>Promedio n_per</option>{analysis==="Buffer"&&<><label>Radio del buffer<select value={radius} onChange={e=>setRadius(Number(e.target.value))}><option value={100}>100 m</option><option value={250}>250 m</option><option value={500}>500 m</option><option value={1000}>1.000 m</option></select></label></>}</select></label></div>'
          good='<div className="analysisInline"><label>Tipo de análisis<select value={analysis} onChange={e=>setAnalysis(e.target.value)}><option>Cantidad de registros</option><option>Buffer</option><option>Proximidad</option><option>Densidad</option><option>Isócronas</option><option>Suma n_per</option><option>Promedio n_per</option></select></label>{analysis==="Buffer"&&<label className="bufferRadius">Radio del buffer<select value={radius} onChange={e=>setRadius(Number(e.target.value))}><option value={100}>100 m</option><option value={250}>250 m</option><option value={500}>500 m</option><option value={1000}>1.000 m</option></select></label>}</div>'
          if bad in s:
              s=s.replace(bad,good,1)
          elif good not in s:
              raise SystemExit('No se encontró la estructura esperada del control de buffer')
          p.write_text(s)
          PY
      - name: Comprobaciones estructurales
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx').read_text()
          m=Path('app/InteractiveMap.tsx').read_text()
          assert '<option>Promedio n_per</option></select></label>{analysis==="Buffer"' in p
          assert '<div className="visualBlock"><b>2. Visualización / capas independientes</b>' in p
          assert 'if(viz!=="draw")e.stopPropagation()' in m
          assert 'if(viz==="draw")return;' in m
          print('Estructura de Polígono y Buffer: OK')
          PY
      - name: Validar build
        run: |
          npm ci
          npx next build --webpack
      - name: Guardar correcciones
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/InteractiveMap.tsx app/page.tsx
          git commit -m 'Visor: validar poligono y corregir buffer en seleccion' || exit 0
          git push
