name: Reparar render V2 e inhabilitar coberturas complejas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Aplicar reparación controlada
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/InteractiveMap.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'const MAX_RENDER_FEATURES=1800,MAX_POLYGON_RENDER_FEATURES=320,MAX_LINE_RENDER_FEATURES=650,MAX_SELECTED_POINTS=5000,MAX_PARTS=40,MAX_POINTS_PER_PART=70;'
          new = 'const MAX_RENDER_FEATURES=1800,MAX_POLYGON_RENDER_FEATURES=180,MAX_LINE_RENDER_FEATURES=650,MAX_SELECTED_POINTS=5000,MAX_PARTS=40,MAX_POINTS_PER_PART=70;'
          assert old in s, 'No se encontró la constante esperada de presupuesto de render'
          s = s.replace(old, new, 1)

          old = 'function linePath(f:GeoFeature,z:number,cx:number,cy:number,maxParts=MAX_PARTS,maxPoints=MAX_POINTS_PER_PART){const lines0=f.geometry.type==="LineString"?[f.geometry.coordinates]:f.geometry.coordinates;const lines=sampleArray(lines0,maxParts);return lines.map((line:number[][])=>sampleArray(line,maxPoints).map((p,i)=>{const[x,y]=project(p,z,cx,cy);return`${i?"L":"M"}${x.toFixed(1)} ${y.toFixed(1)}`}).join("")).join(" ")}'
          new = 'function linePath(f:GeoFeature,z:number,cx:number,cy:number,maxParts=MAX_PARTS,maxPoints=MAX_POINTS_PER_PART){const lines0=(f.geometry.type==="LineString"?[f.geometry.coordinates]:f.geometry.coordinates) as number[][][];const lines=sampleArray(lines0,maxParts);return lines.map((line:number[][])=>sampleArray(line,maxPoints).map((p,i)=>{const[x,y]=project(p,z,cx,cy);return`${i?"L":"M"}${x.toFixed(1)} ${y.toFixed(1)}`}).join("")).join(" ")}'
          assert old in s, 'No se encontró linePath esperado'
          s = s.replace(old, new, 1)

          old = 'const hideSelectedPoints=id===selectedLayerId&&(viz==="cluster"||viz==="heat");const heavy=fc.features.length>600;const layerDetail=heavy?{parts:Math.min(detail.parts,12),points:Math.min(detail.points,28)}:detail;'
          new = 'const hideSelectedPoints=id===selectedLayerId&&(viz==="cluster"||viz==="heat");const polygonLayer=fc.features.some(f=>f.geometry.type==="Polygon"||f.geometry.type==="MultiPolygon");const polygonHeavy=polygonLayer&&fc.features.length>150;const heavy=polygonHeavy||fc.features.length>600;const layerDetail=polygonHeavy?{parts:Math.min(detail.parts,8),points:Math.min(detail.points,22)}:heavy?{parts:Math.min(detail.parts,12),points:Math.min(detail.points,28)}:detail;'
          assert old in s, 'No se encontró el bloque heavy esperado'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          anchor = 'const thematicGroups=groups.filter(([c])=>c!=="BASE");'
          insert = '''const thematicGroups=groups.filter(([c])=>c!=="BASE");
const TEMPORARILY_DISABLED=new Set<string>([
 "vf-amb-pol-areas-verdes",
 "vf-amb-pol-averde-prc",
 "vf-amb-pol-mascotas-mz-2026",
 "vf-amb-pol-ndvi-stgo-oct-2025",
 "vf-amb-pol-ndwi-stgo-2025",
 "vf-amb-pol-plazas-2026",
 "vf-amb-pol-reciclaje-manzana",
 "vf-amb-pol-reciclaje-vf"
]);
const temporarilyDisabled=(id:string)=>TEMPORARILY_DISABLED.has(id);'''
          assert anchor in s, 'No se encontró thematicGroups'
          s = s.replace(anchor, insert, 1)

          old = 'const toggle=(id:string)=>setActive(a=>a.includes(id)?a.filter(x=>x!==id):[...a,id]);const ensureActive=(id:string)=>setActive(a=>a.includes(id)?a:[...a,id]);'
          new = 'const toggle=(id:string)=>{if(temporarilyDisabled(id))return;setActive(a=>a.includes(id)?a.filter(x=>x!==id):[...a,id])};const ensureActive=(id:string)=>{if(temporarilyDisabled(id))return;setActive(a=>a.includes(id)?a:[...a,id])};'
          assert old in s, 'No se encontró toggle/ensureActive'
          s = s.replace(old, new, 1)

          old = 'const openFromIndex=(item:IndexItem)=>{const id=item.mapId||item.id;if(!layers.some(l=>l.id===id))return;ensureActive(id);setSelected(id)};'
          new = 'const openFromIndex=(item:IndexItem)=>{const id=item.mapId||item.id;if(!layers.some(l=>l.id===id)||temporarilyDisabled(id))return;ensureActive(id);setSelected(id)};'
          assert old in s, 'No se encontró openFromIndex'
          s = s.replace(old, new, 1)

          old = 'const toggleFromIndex=(item:IndexItem)=>{const id=item.mapId||item.id;if(!layers.some(l=>l.id===id))return;setActive(a=>{'
          new = 'const toggleFromIndex=(item:IndexItem)=>{const id=item.mapId||item.id;if(!layers.some(l=>l.id===id)||temporarilyDisabled(id))return;setActive(a=>{'
          assert old in s, 'No se encontró toggleFromIndex'
          s = s.replace(old, new, 1)

          old = 'return <button key={i.id} className={on?"on":""} onClick={()=>toggleFromIndex(i)}><span>{on?"✓":"+"}</span><b>{i.nombre}</b><small>{itemDimension(i).replace("DIMENSIÓN ","")} · {itemSector(i)}</small></button>'
          new = 'const blocked=temporarilyDisabled(id);return <button key={i.id} disabled={blocked} className={on?"on":""} onClick={()=>toggleFromIndex(i)}><span>{blocked?"×":on?"✓":"+"}</span><b>{i.nombre}</b><small>{blocked?"Temporalmente en corrección":`${itemDimension(i).replace("DIMENSIÓN ","")} · ${itemSector(i)}`}</small></button>'
          assert old in s, 'No se encontró botón de resultados laterales'
          s = s.replace(old, new, 1)

          old = 'return <tr key={i.id}><td className="mapCheck">{i.verEnMapa&&i.mapId?<label><input type="checkbox" checked={on} onChange={()=>toggleFromIndex(i)}/><span>{on?"Activa":"Activar"}</span></label>:"—"}</td>'
          new = 'const blocked=temporarilyDisabled(mapId);return <tr key={i.id}><td className="mapCheck">{i.verEnMapa&&i.mapId?<label><input type="checkbox" disabled={blocked} checked={on&&!blocked} onChange={()=>toggleFromIndex(i)}/><span>{blocked?"Temporalmente en corrección":on?"Activa":"Activar"}</span></label>:"—"}</td>'
          assert old in s, 'No se encontró checkbox del índice'
          s = s.replace(old, new, 1)

          old = '<td><strong>{i.nombre}</strong><small>{i.carpeta||"Repositorio visor"}</small></td>'
          new = '<td><strong>{i.nombre}</strong><small>{temporarilyDisabled(mapId)?"Temporalmente en corrección":(i.carpeta||"Repositorio visor")}</small></td>'
          assert old in s, 'No se encontró celda de nombre'
          s = s.replace(old, new, 1)

          old = '{i.verEnMapa&&i.mapId&&<button className="applyAction" onClick={()=>openFromIndex(i)}>Seleccionar</button>}'
          new = '{i.verEnMapa&&i.mapId&&<button disabled={temporarilyDisabled(mapId)} className="applyAction" onClick={()=>openFromIndex(i)}>{temporarilyDisabled(mapId)?"En corrección":"Seleccionar"}</button>}'
          assert old in s, 'No se encontró botón Seleccionar'
          s = s.replace(old, new, 1)

          old = '<section className="map"><InteractiveMap data={data} active={active}'
          new = '<section className="map"><InteractiveMap data={data} active={active.filter(id=>!temporarilyDisabled(id))}'
          assert old in s, 'No se encontró InteractiveMap active'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Validar build de producción
        run: |
          npm ci
          npx next build --webpack
      - name: Guardar reparación
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/InteractiveMap.tsx app/page.tsx
          git diff --cached --check
          git commit -m 'Reparar render V2 e inhabilitar temporalmente coberturas complejas'
          git push origin main
