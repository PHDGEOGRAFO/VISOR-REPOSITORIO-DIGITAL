name: Corregir geometria manzanas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corregir-manzanas-geometria.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar geometria completa de manzanas con carga diferida
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text(encoding='utf-8')
          old='''const layerFetch:Promise<GeoCollection>=layer.id==="manzana"\n   ?Promise.all(["CENTRO_ORIENTE","CENTRO_PONIENTE","NORORIENTE","NORPONIENTE","SURORIENTE","SURPONIENTE"].map(n=>fetch(`${BASE_PATH}/data/manzanas/${n}.geojson`).then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()}))).then(parts=>({type:"FeatureCollection",features:parts.flatMap((x:GeoCollection)=>x.features)} as GeoCollection))\n   :fetch(layer.url).then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()});'''
          new='''const layerFetch:Promise<GeoCollection>=fetch(layer.url).then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()});'''
          if old not in s:
              raise SystemExit('No se encontro el bloque de carga simplificada de manzanas; no se modifica nada')
          s=s.replace(old,new)
          # Mantener carga bajo demanda: no reintroducir precarga de todas las capas BASE.
          if 'const shouldLoad=layer.theme==="BASE"' in s:
              raise SystemExit('Se detecto precarga BASE; abortando para no reintroducir caidas')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar build
        run: |
          npm ci
          npx next build --webpack
      - name: Guardar correccion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Visor: restaurar limites completos de manzana'
          git push
