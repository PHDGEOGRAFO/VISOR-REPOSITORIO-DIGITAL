name: Sincronizar Biblioteca Digital

# Validación manual de acceso, sin sobrescribir el catálogo publicado.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-biblioteca-digital
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --disable-pip-version-check requests openpyxl google-auth
      - name: Validar acceso al Excel sin publicar datos
        env:
          BIBLIOTECA_CONTROL_FILE_ID: 1yDL59OYZurxeh17lCDrjtyDBl3ZMUsx4
          BIBLIOTECA_CONTROL_URL: ${{ secrets.BIBLIOTECA_CONTROL_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os, io, json
          import requests
          from openpyxl import load_workbook
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          url = os.environ.get('BIBLIOTECA_CONTROL_URL', '').strip()
          key = os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON', '').strip()
          file_id = os.environ['BIBLIOTECA_CONTROL_FILE_ID']
          if key:
              credentials = service_account.Credentials.from_service_account_info(
                  json.loads(key), scopes=['https://www.googleapis.com/auth/drive.readonly'])
              session = AuthorizedSession(credentials)
              response = session.get(f'https://www.googleapis.com/drive/v3/files/{file_id}',
                  params={'alt': 'media', 'supportsAllDrives': 'true'}, timeout=90)
          elif url:
              response = requests.get(url, timeout=90, allow_redirects=True)
          else:
              raise SystemExit('Configure GOOGLE_SERVICE_ACCOUNT_JSON o BIBLIOTECA_CONTROL_URL antes de ejecutar la validación manual.')
          if not response.ok:
              raise SystemExit(f'No se pudo descargar el control: HTTP {response.status_code}')
          if not response.content.startswith(b'PK'):
              raise SystemExit('La respuesta no corresponde a un archivo XLSX.')
          wb = load_workbook(io.BytesIO(response.content), read_only=True, data_only=True)
          if 'Registro Maestro' not in wb.sheetnames:
              raise SystemExit('No existe la hoja Registro Maestro.')
          ws = wb['Registro Maestro']
          headers = next(ws.values, ())
          required = {'ID correlativo', 'Nombre de cobertura'}
          if not required.issubset(set(headers)):
              raise SystemExit('Faltan columnas requeridas del Registro Maestro.')
          count = sum(1 for row in ws.iter_rows(min_row=2, values_only=True) if any(v is not None for v in row))
          if count == 0:
              raise SystemExit('Registro Maestro vacío.')
          # Comparación de identificadores; nunca publicar datos del maestro.
          source_ids = set()
          id_col = headers.index('ID correlativo')
          for row in ws.iter_rows(min_row=2, values_only=True):
              value = row[id_col] if id_col < len(row) else None
              if value is not None and str(value).strip():
                  if isinstance(value, float) and value.is_integer():
                      value = int(value)
                  source_ids.add('bd-' + str(value).strip())
          from pathlib import Path
          catalog = json.loads(Path('public/catalog/index_coberturas.json').read_text(encoding='utf-8'))
          public_ids = {str(item.get('id')) for item in catalog.get('items', []) if str(item.get('id', '')).startswith('bd-')}
          matched = len(source_ids & public_ids)
          source_only = len(source_ids - public_ids)
          public_only = len(public_ids - source_ids)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'### Comparación de identificadores\\nCoincidentes: {matched}. Solo en origen: {source_only}. Solo en catálogo: {public_only}.\\n')
              f.write('Las diferencias no implican autorización de publicación. No se agregan, eliminan ni modifican coberturas.\\n')
          wb.close()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'### Acceso al control validado\nFilas no vacías: {count}. Catálogo publicado sin cambios.\n')
          print('Acceso y estructura validados. No se publicaron datos.')
          PY
