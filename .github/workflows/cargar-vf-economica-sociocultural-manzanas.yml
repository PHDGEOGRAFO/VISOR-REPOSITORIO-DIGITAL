name: Cargar VF Ambiental Economica Sociocultural y Manzanas

# Cargador histórico: no ejecutar automáticamente ni publicar maestros.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - name: Informar procedimiento vigente
        run: |
          echo "::notice::Cargador histórico retirado: controles de cantidad obsoletos y publicación de GPKG maestros no autorizada."
          echo "Se conserva el visor y catálogo publicados."
          echo "No se han descargado ni publicado datos."
          echo "### Cargador histórico retirado" >> "$GITHUB_STEP_SUMMARY"
          echo "No se actualizaron coberturas. Usar un proceso de publicación segura validado." >> "$GITHUB_STEP_SUMMARY"
