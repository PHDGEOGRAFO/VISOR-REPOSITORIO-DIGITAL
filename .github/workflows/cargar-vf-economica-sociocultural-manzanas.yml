name: Cargar VF Economica Sociocultural y Manzanas

on:
  push:
    paths:
      - '.github/workflows/cargar-vf-economica-sociocultural-manzanas.yml'
      - 'scripts/load_vf_dimensions.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar GIS
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3
          python -m pip install --upgrade pip gdown
      - name: Cargar dimensiones VF y corregir manzanas
        run: |
          sed -i 's/FROM LIMITE_BARRIOS WHERE TERRITORIO IS NOT NULL GROUP BY TERRITORIO/FROM LIMITE_MANZANA_CENSAL WHERE TERRITORIO IS NOT NULL GROUP BY TERRITORIO/' scripts/load_vf_dimensions.py
          sed -i "s/\['ogr2ogr','-f','GeoJSON'/['ogr2ogr','-skipfailures','-f','GeoJSON'/g" scripts/load_vf_dimensions.py
          python scripts/load_vf_dimensions.py
      - name: Limpiar geometrías web inválidas y registrar control
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          def coords_ok(c):
              if not isinstance(c,(list,tuple)) or not c:
                  return False
              if isinstance(c[0],(int,float)):
                  if len(c)<2:return False
                  x,y=float(c[0]),float(c[1])
                  return math.isfinite(x) and math.isfinite(y) and -180<=x<=180 and -90<=y<=90
              return all(coords_ok(v) for v in c)

          manifests=[Path('public/data/economica/manifest_04_dim_economica_vf.json'),Path('public/data/sociocultural/manifest_03_dim_sociocultural_vf.json')]
          controls=[]
          for mp in manifests:
              m=json.loads(mp.read_text(encoding='utf-8'))
              for it in m['items']:
                  fp=Path('public')/it['geojson'].lstrip('/')
                  fc=json.loads(fp.read_text(encoding='utf-8'))
                  before=len(fc.get('features',[]))
                  clean=[]
                  for f in fc.get('features',[]):
                      g=f.get('geometry')
                      if not g or not coords_ok(g.get('coordinates')):
                          continue
                      clean.append(f)
                  fc['features']=clean
                  fp.write_text(json.dumps(fc,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
                  source=int(it.get('records') or before)
                  it['registros_fuente']=source
                  it['registros_web']=len(clean)
                  it['omitidos_invalidos']=max(0,source-len(clean))
                  controls.append((it['table'],source,len(clean),it['omitidos_invalidos']))
              mp.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')

          cp=Path('public/catalog/index_coberturas.json')
          cat=json.loads(cp.read_text(encoding='utf-8'))
          by_table={t:(src,web,omit) for t,src,web,omit in controls}
          for it in cat.get('items',[]):
              t=it.get('subcapa')
              if t in by_table:
                  src,web,omit=by_table[t]
                  it['registrosFuente']=src
                  it['registros']=web
                  it['omitidosInvalidos']=omit
                  if omit:
                      it['observaciones']=(it.get('observaciones','')+f' Control geométrico web: {web} válidos de {src}; {omit} geometría(s) inválida(s) omitida(s).').strip()
          cp.write_text(json.dumps(cat,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('CONTROL GEOMETRÍAS')
          for row in controls:
              if row[3]: print(row)
          print('Total omitidas:',sum(r[3] for r in controls))
          PY
      - name: Validar estructura, datos, geometrías y build
        run: |
          test -f public/data/gpkg/00_BASE_TERRITORIAL_VF.gpkg
          test -f public/data/gpkg/04_DIM_ECONOMICA_VF.gpkg
          test -f public/data/gpkg/03_DIM_SOCIOCULTURAL_VF.gpkg
          test -f public/data/comuna.geojson
          test -f public/data/territorios.geojson
          test -f public/data/barrios.geojson
          test -f public/data/manzanas.geojson
          test -f public/data/calles_santiago.geojson
          test -f public/data/unidades_vecinales.geojson
          grep -q 'GENERATED_VF_LAYERS_START' app/page.tsx
          grep -q 'Base: Manzanas Censo 2024' app/page.tsx
          python - <<'PY'
          import json, math
          from pathlib import Path
          eco=json.load(open('public/data/economica/manifest_04_dim_economica_vf.json',encoding='utf-8'))
          soc=json.load(open('public/data/sociocultural/manifest_03_dim_sociocultural_vf.json',encoding='utf-8'))
          assert eco['total']==22, eco['total']
          assert soc['total']==25, soc['total']
          assert len(list(Path('public/data/economica').glob('*.geojson')))==22
          assert len(list(Path('public/data/sociocultural').glob('*.geojson')))==25
          mz=json.load(open('public/data/manzanas.geojson',encoding='utf-8'))
          assert len(mz['features'])==1711, len(mz['features'])
          assert round(sum(float(f.get('properties',{}).get('n_per') or 0) for f in mz['features']))==432081
          assert all('COD_MZN' in f.get('properties',{}) and 'n_per' in f.get('properties',{}) for f in mz['features'])
          bar=json.load(open('public/data/barrios.geojson',encoding='utf-8'))
          assert len(bar['features'])==27
          names={str(f.get('properties',{}).get('BARRIO','')).upper() for f in bar['features']}
          assert {'REPUBLICA','RONDIZZONI',"PARQUE O'HIGGINS"}.issubset(names)
          ter=json.load(open('public/data/territorios.geojson',encoding='utf-8'))
          assert len(ter['features'])==6, len(ter['features'])
          calles=json.load(open('public/data/calles_santiago.geojson',encoding='utf-8'))
          assert len(calles['features'])==5019
          assert all('NOMBRE_VIA' in f.get('properties',{}) for f in calles['features'])
          def coords_ok(c):
              if not isinstance(c,(list,tuple)) or not c:return False
              if isinstance(c[0],(int,float)):
                  x,y=float(c[0]),float(c[1])
                  return math.isfinite(x) and math.isfinite(y) and -180<=x<=180 and -90<=y<=90
              return all(coords_ok(v) for v in c)
          for d in ['public/data/economica','public/data/sociocultural']:
              for fp in Path(d).glob('*.geojson'):
                  fc=json.loads(fp.read_text(encoding='utf-8'))
                  assert all(f.get('geometry') and coords_ok(f['geometry'].get('coordinates')) for f in fc['features']), fp
          allitems=eco['items']+soc['items']
          assert all('registros_web' in x and 'omitidos_invalidos' in x for x in allitems)
          assert sum(x['registros_web'] for x in allitems)>0
          print('VALIDACIÓN VF OK: base territorial final + 22 ECO + 25 SOC + geometrías web válidas')
          print('Omitidas por geometría inválida:',sum(x['omitidos_invalidos'] for x in allitems))
          PY
          npm ci
          npx next build --webpack
      - name: Guardar carga
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx public/catalog/index_coberturas.json \
            public/data/gpkg public/data/economica public/data/sociocultural \
            public/data/comuna.geojson public/data/territorios.geojson public/data/barrios.geojson \
            public/data/manzanas.geojson public/data/calles_santiago.geojson public/data/unidades_vecinales.geojson
          git commit -m 'Visor: cargar base territorial y dimensiones VF validadas' || exit 0
          git push
