name: Cargar VF Economica Sociocultural y Manzanas

on:
  push:
    paths:
      - '.github/workflows/cargar-vf-economica-sociocultural-manzanas.yml'
      - 'scripts/load_vf_dimensions.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar GIS
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin sqlite3
          python -m pip install --upgrade pip gdown
      - name: Cargar dimensiones VF y corregir manzanas
        run: python scripts/load_vf_dimensions.py
      - name: Validar estructura y build
        run: |
          test -f public/data/gpkg/04_DIM_ECONOMICA_VF.gpkg
          test -f public/data/gpkg/03_DIM_SOCIOCULTURAL_VF.gpkg
          grep -q 'GENERATED_VF_LAYERS_START' app/page.tsx
          grep -q 'Base: Manzanas Censo 2024' app/page.tsx
          npm ci
          npx next build --webpack
      - name: Guardar carga
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx public/catalog/index_coberturas.json public/data/gpkg public/data/economica public/data/sociocultural
          git commit -m 'Visor: cargar VF economica y sociocultural con n_per por manzana' || exit 0
          git push
