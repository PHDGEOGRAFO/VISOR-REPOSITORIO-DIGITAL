name: Prueba integral herramientas del visor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prueba-integral-herramientas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar exportacion real
        run: npx next build --webpack
      - name: Instalar Chromium de pruebas
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Preparar sitio con basePath de GitHub Pages
        run: |
          mkdir -p smoke-site/VISOR-REPOSITORIO-DIGITAL
          cp -a out/. smoke-site/VISOR-REPOSITORIO-DIGITAL/
          python3 -m http.server 4173 --directory smoke-site > /tmp/visor-http.log 2>&1 &
          echo $! > /tmp/visor-http.pid
          sleep 2
      - name: Probar herramientas en Chromium
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
          const results=[];
          const ok=(name,detail='')=>{results.push({name,status:'OK',detail});console.log('OK',name,detail)};
          const fail=(name,e)=>{results.push({name,status:'FAIL',detail:String(e?.message||e)});console.error('FAIL',name,e?.message||e)};
          async function test(name,fn){try{await fn();ok(name)}catch(e){fail(name,e)}}
          async function clickText(text){const loc=page.getByText(text,{exact:true}).last();await loc.scrollIntoViewIfNeeded();await loc.click({timeout:10000})}
          await page.goto('http://127.0.0.1:4173/VISOR-REPOSITORIO-DIGITAL/',{waitUntil:'networkidle',timeout:60000});
          await test('Carga inicial',async()=>{await page.getByText('Herramientas del mapa',{exact:true}).waitFor();});
          await test('Sin mojibake visible',async()=>{const body=await page.locator('body').innerText();if(/[ÃÂ�]/.test(body))throw new Error('Se detectaron caracteres de codificacion dañada');});
          await test('Activar Aparcadores Ilegales',async()=>{const t=page.getByText('Aparcadores Ilegales',{exact:true}).first();await t.scrollIntoViewIfNeeded();await t.click();await page.waitForTimeout(1000);});
          await test('Selector cobertura activa',async()=>{const sel=page.locator('.activeCoverage select');await sel.waitFor();const options=await sel.locator('option').allTextContents();if(!options.some(x=>x.includes('Aparcadores Ilegales')))throw new Error('Aparcadores no aparece en selector');});
          await test('Desagregar por',async()=>{const sel=page.locator('.disaggregateControl select');const vals=await sel.locator('option').evaluateAll(os=>os.map(o=>o.value).filter(Boolean));if(!vals.length)throw new Error('No hay campos habilitados');await sel.selectOption(vals[0]);await page.waitForTimeout(300);});
          await test('Seleccionar puntos',async()=>{await clickText('Seleccionar puntos');});
          await test('Modo Polígono',async()=>{await clickText('Polígono');});
          const analysis=page.locator('.analysisInline select').first();
          for(const name of ['Cantidad de registros','Buffer','Proximidad','Densidad','Isócronas','Suma n_per','Promedio n_per']){
            await test('Análisis: '+name,async()=>{await analysis.selectOption({label:name});await page.waitForTimeout(name==='Isócronas'?1300:300);const txt=(await page.locator('.analysisResult').innerText()).trim();if(!txt)throw new Error('Resultado vacío');});
          }
          await analysis.selectOption({label:'Cantidad de registros'});
          for(const name of ['Puntos','Clúster','Calor','Líneas oficiales']){
            await test('Visualización: '+name,async()=>{const b=page.getByRole('button',{name,exact:true}).last();await b.scrollIntoViewIfNeeded();await b.click();await page.waitForTimeout(300);});
          }
          for(const name of ['Tabla','Metadatos','Reporte']){
            await test('Ventana: '+name,async()=>{await page.getByRole('button',{name,exact:true}).click();await page.waitForTimeout(250);const modal=page.locator('.utilityModal,.modal,.dialogWindow').last();await modal.waitFor({timeout:5000});const close=modal.getByRole('button',{name:/cerrar|×|x/i}).last();if(await close.count())await close.click();});
          }
          await test('SantIA comuna',async()=>{const ta=page.locator('.santiAsk textarea');await ta.fill('cuántos aparcadores hay en la comuna');await page.getByRole('button',{name:'Consultar'}).click();await page.waitForTimeout(600);const r=(await page.locator('.santiResponse').innerText()).trim();if(!r)throw new Error('SantIA sin respuesta');});
          await test('Activar Barrios sin reload',async()=>{const before=page.url();const label=page.getByText('Barrios',{exact:true}).first();await label.scrollIntoViewIfNeeded();await label.click();await page.waitForTimeout(1500);if(page.isClosed())throw new Error('Pagina cerrada');if(page.url()!==before)throw new Error('Navegacion/reload inesperado');});
          await test('SantIA Barrio Brasil',async()=>{const ta=page.locator('.santiAsk textarea');await ta.fill('cuántos aparcadores hay en barrio Brasil');await page.getByRole('button',{name:'Consultar'}).click();await page.waitForTimeout(1200);const r=(await page.locator('.santiResponse').innerText()).trim();if(!r)throw new Error('SantIA sin respuesta por barrio');if(/0 barrios/i.test(r))throw new Error('SantIA sigue reportando 0 barrios');});
          await test('Activar Territorios sin reload',async()=>{const before=page.url();const label=page.getByText('Territorios',{exact:true}).first();await label.scrollIntoViewIfNeeded();await label.click();await page.waitForTimeout(1200);if(page.url()!==before)throw new Error('Navegacion/reload inesperado');});
          await test('Activar Manzanas sin reload',async()=>{const before=page.url();const label=page.getByText(/Manzanas · Censo 2024/).first();await label.scrollIntoViewIfNeeded();await label.click();await page.waitForTimeout(2500);if(page.url()!==before)throw new Error('Navegacion/reload inesperado');});
          await page.screenshot({path:'smoke-final.png',fullPage:true});
          const failed=results.filter(x=>x.status==='FAIL');
          console.log('\nRESULTADOS',JSON.stringify(results,null,2));
          if(errors.length)console.error('\nERRORES DE NAVEGADOR',errors.join('\n'));
          await browser.close();
          if(failed.length||errors.length)process.exit(1);
          JS
          node smoke.mjs
      - name: Subir captura final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-integral-herramientas
          path: |
            smoke-final.png
            /tmp/visor-http.log
          if-no-files-found: ignore
