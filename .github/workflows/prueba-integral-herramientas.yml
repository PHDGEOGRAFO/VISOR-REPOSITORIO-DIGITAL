name: Prueba integral herramientas del visor

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/prueba-integral-herramientas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar exportacion real
        run: npx next build --webpack
      - name: Instalar Chromium de pruebas
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Preparar sitio con basePath de GitHub Pages
        run: |
          mkdir -p smoke-site/VISOR-REPOSITORIO-DIGITAL
          cp -a out/. smoke-site/VISOR-REPOSITORIO-DIGITAL/
          python3 -m http.server 4173 --directory smoke-site > /tmp/visor-http.log 2>&1 &
          echo $! > /tmp/visor-http.pid
          sleep 2
      - name: Probar herramientas en Chromium
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          page.setDefaultTimeout(15000);
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error'&&!/tile.openstreetmap.org/i.test(m.text())) errors.push('console: '+m.text())});
          const results=[];
          const ok=(name,detail='')=>{results.push({name,status:'OK',detail});console.log('OK',name,detail)};
          const fail=(name,e)=>{results.push({name,status:'FAIL',detail:String(e?.message||e)});console.error('FAIL',name,e?.message||e)};
          async function test(name,fn){try{await fn();ok(name)}catch(e){fail(name,e)}}
          async function clickText(text){const loc=page.getByText(text,{exact:true}).last();await loc.scrollIntoViewIfNeeded();await loc.click();}
          await page.goto('http://127.0.0.1:4173/VISOR-REPOSITORIO-DIGITAL/',{waitUntil:'networkidle',timeout:60000});
          await test('Carga inicial',async()=>{await page.getByText('Herramientas del mapa',{exact:true}).waitFor();});
          await test('Descripcion institucional',async()=>{await page.getByText(/Información territorial elaborada a partir de antecedentes proporcionados por direcciones y oficinas municipales/).waitFor();});
          await test('Sin mojibake visible',async()=>{const body=await page.locator('body').innerText();if(/[ÃÂ�]/.test(body))throw new Error('Se detectaron caracteres de codificacion dañada');});
          await test('Activar Aparcadores Ilegales',async()=>{
            const search=page.locator('.sidebarSearch input');
            await search.fill('Aparcadores Ilegales');
            const result=page.locator('.sidebarResults button').filter({hasText:'Aparcadores Ilegales'}).first();
            await result.waitFor();await result.click();await page.waitForTimeout(1000);
            const sel=page.locator('.activeCoverage select');
            const opts=await sel.locator('option').evaluateAll(os=>os.map(o=>({v:o.value,t:o.textContent||''})));
            const opt=opts.find(o=>o.t.includes('Aparcadores Ilegales'));if(!opt)throw new Error('Aparcadores no quedó disponible en Herramientas');
            await sel.selectOption(opt.v);await page.waitForTimeout(900);
          });
          await test('Selector cobertura activa',async()=>{const txt=await page.locator('.activeCoverage select option:checked').innerText();if(!txt.includes('Aparcadores Ilegales'))throw new Error('Aparcadores no quedó seleccionado');});
          await test('Desagregar por',async()=>{const sel=page.locator('.disaggregateControl select');const vals=await sel.locator('option').evaluateAll(os=>os.map(o=>o.value).filter(Boolean));if(!vals.length)throw new Error('No hay campos habilitados');await sel.selectOption(vals[0]);await page.waitForTimeout(300);});
          await test('Seleccionar puntos',async()=>{await clickText('Seleccionar puntos');});
          await test('Modo Polígono',async()=>{await clickText('Polígono');});
          await test('Promedio n_per eliminado',async()=>{const labels=await page.locator('.analysisInline select').first().locator('option').allTextContents();if(labels.some(x=>x.includes('Promedio n_per')))throw new Error('Promedio n_per sigue presente');if(!labels.some(x=>x.includes('Suma n_per')))throw new Error('Suma n_per no está disponible');});
          for(const name of ['Cantidad de registros','Buffer','Proximidad','Densidad','Isócronas','Suma n_per']){
            await test('Análisis: '+name,async()=>{const analysis=page.locator('.analysisInline select').first();await analysis.selectOption({label:name});await page.waitForTimeout(name==='Isócronas'?1500:500);const txt=(await page.locator('.analysisResult').innerText()).trim();if(!txt)throw new Error('Resultado vacío');if(name==='Suma n_per'&&!/Manzanas INE Censo 2024|Manzanas INE · Censo 2024/i.test(txt))throw new Error('Suma n_per no identifica base INE 2024');});
          }
          await page.locator('.analysisInline select').first().selectOption({label:'Cantidad de registros'});
          await clickText('Seleccionar puntos');
          for(const name of ['Puntos','Clúster','Calor','Líneas oficiales']){
            await test('Visualización: '+name,async()=>{const b=page.getByRole('button',{name,exact:true}).last();await b.scrollIntoViewIfNeeded();await b.click();await page.waitForTimeout(300);});
          }
          for(const name of ['Tabla','Metadatos','Reporte']){
            await test('Ventana: '+name,async()=>{
              await page.getByRole('button',{name,exact:true}).click();await page.waitForTimeout(250);
              const modal=page.locator('.utilityModal').last();await modal.waitFor();
              const before=await modal.boundingBox();if(!before)throw new Error('Ventana sin dimensiones');
              const resize=await modal.evaluate(el=>getComputedStyle(el).resize);if(resize==='none')throw new Error('Ventana no redimensionable');
              const header=modal.locator('header');const hb=await header.boundingBox();if(!hb)throw new Error('Sin cabecera movible');
              await page.mouse.move(hb.x+80,hb.y+20);await page.mouse.down();await page.mouse.move(hb.x+125,hb.y+55,{steps:4});await page.mouse.up();
              const after=await modal.boundingBox();if(!after||Math.abs(after.x-before.x)<10)throw new Error('La ventana no se desplazó');
              const min=modal.getByRole('button',{name:'Minimizar / restaurar'});await min.click();await page.waitForTimeout(120);if(!(await modal.evaluate(el=>el.classList.contains('floatingMinimized'))))throw new Error('No minimiza');await min.click();
              const close=header.locator('button').last();await close.click();await modal.waitFor({state:'detached'});
            });
          }
          await test('SantIA comuna',async()=>{const ta=page.locator('.santiAsk textarea');await ta.fill('cuántos aparcadores hay en la comuna');await page.getByRole('button',{name:'Consultar'}).click();await page.waitForTimeout(900);const r=(await page.locator('.santiResponse').innerText()).trim();if(!r)throw new Error('SantIA sin respuesta');});
          await test('Activar Barrios sin reload',async()=>{const before=page.url();const label=page.getByText('Barrios',{exact:true}).first();await label.scrollIntoViewIfNeeded();await label.click();await page.waitForTimeout(1600);if(page.isClosed())throw new Error('Pagina cerrada');if(page.url()!==before)throw new Error('Navegacion/reload inesperado');await page.locator('.santiAsk textarea').waitFor();});
          await test('SantIA Barrio Brasil',async()=>{const ta=page.locator('.santiAsk textarea');await ta.fill('cuántos aparcadores hay en barrio Brasil');await page.getByRole('button',{name:'Consultar'}).click();await page.waitForTimeout(1500);const r=(await page.locator('.santiResponse').innerText()).trim();if(!r)throw new Error('SantIA sin respuesta por barrio');if(/0 barrios/i.test(r))throw new Error('SantIA sigue reportando 0 barrios');});
          await test('Activar Territorios sin reload',async()=>{const before=page.url();const label=page.getByText('Territorios',{exact:true}).first();await label.scrollIntoViewIfNeeded();await label.click();await page.waitForTimeout(1300);if(page.url()!==before)throw new Error('Navegacion/reload inesperado');await page.locator('.santiAsk textarea').waitFor();});
          await test('Activar Manzanas INE sin reload',async()=>{const before=page.url();const row=page.locator('.layerControl label').filter({hasText:'Manzanas INE · Censo 2024'}).first();const cb=row.locator('input[type=checkbox]');if(!(await cb.isChecked()))await cb.check();await page.waitForTimeout(3000);if(page.url()!==before)throw new Error('Navegacion/reload inesperado');await page.locator('.santiAsk textarea').waitFor();});
          await test('Notebook 1366x768 muestra Visualización',async()=>{await page.setViewportSize({width:1366,height:768});const block=page.locator('.visualBlock');await block.scrollIntoViewIfNeeded();await block.waitFor({state:'visible'});const box=await block.boundingBox();if(!box||box.y<0||box.y>=768)throw new Error('Visualización queda fuera de pantalla');});
          await page.screenshot({path:'smoke-final.png',fullPage:true});
          const failed=results.filter(x=>x.status==='FAIL');
          console.log('\nRESULTADOS',JSON.stringify(results,null,2));
          if(errors.length)console.error('\nERRORES DE NAVEGADOR',errors.join('\n'));
          await browser.close();
          if(failed.length||errors.length)process.exit(1);
          JS
          node smoke.mjs
      - name: Subir captura final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-integral-herramientas
          path: |
            smoke-final.png
            /tmp/visor-http.log
          if-no-files-found: ignore
