name: Aplicar corrección coberturas SANTI logo

on:
  push:
    paths:
      - 'scripts/fix-coberturas-santi-logo.py'
      - '.github/workflows/apply-fix-coberturas-santi-logo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcciones
        run: python scripts/fix-coberturas-santi-logo.py
      - name: Validar build
        run: |
          npm ci
          npx next build --webpack
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/santi.ts app/map-gray.css public/catalog/index_coberturas.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Visor: corregir logo, coberturas y consulta espacial SANTI"
          git push
