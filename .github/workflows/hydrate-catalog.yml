name: Cargar inventario completo Biblioteca Digital

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hydrate-catalog.yml'
      - 'public/catalog/index_coberturas_full.json.gz'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expandir inventario completo
        run: gzip -dc public/catalog/index_coberturas_full.json.gz > public/catalog/index_coberturas.json
      - name: Validar total
        run: |
          python - <<'PY'
          import json
          p=json.load(open('public/catalog/index_coberturas.json',encoding='utf-8'))
          assert len(p.get('items',[])) >= 900, f"Inventario incompleto: {len(p.get('items',[]))}"
          print('Coberturas:',len(p['items']))
          PY
      - name: Publicar índice completo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog/index_coberturas.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Catálogo: publicar inventario completo Biblioteca Digital"
          git push
