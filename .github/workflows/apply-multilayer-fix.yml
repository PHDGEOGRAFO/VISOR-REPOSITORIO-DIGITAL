name: Aplicar optimizacion multicapas

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_multilayer_fix.py
      - .github/workflows/apply-multilayer-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche de rendimiento
        run: python scripts/apply_multilayer_fix.py
      - name: Guardar cambio en InteractiveMap
        run: |
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveMap.tsx
          git commit -m "Optimizar render para 8 coberturas simultaneas"
          git push
