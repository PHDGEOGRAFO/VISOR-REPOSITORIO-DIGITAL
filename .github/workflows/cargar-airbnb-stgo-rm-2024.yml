name: Cargar Airbnb STGO y RM 2024

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cargar-airbnb-stgo-rm-2024.yml'

permissions:
  contents: write

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar GIS y descarga Drive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          python -m pip install -q gdown
      - name: Descargar GPKG oficiales Airbnb
        run: |
          mkdir -p public/data/turismo public/data/gpkg /tmp/airbnb
          gdown 1oDdbUca2t9RKbfJZxw5YlEOyPyidOgIT -O /tmp/airbnb/TUR_PTO_AIRBNB_STGO_2024.gpkg
          gdown 1norQu21sliU7e4XJS1WBd7nrCvnjtb_M -O /tmp/airbnb/TUR_PTO_AIRBNB_RM_2024.gpkg
          test -s /tmp/airbnb/TUR_PTO_AIRBNB_STGO_2024.gpkg
          test -s /tmp/airbnb/TUR_PTO_AIRBNB_RM_2024.gpkg
      - name: Validar y convertir
        run: |
          set -e
          STGO_COUNT=$(ogrinfo -ro -al -so /tmp/airbnb/TUR_PTO_AIRBNB_STGO_2024.gpkg TUR_PTO_AIRBNB_STGO_2024 | awk -F': ' '/Feature Count/{print $2;exit}')
          RM_COUNT=$(ogrinfo -ro -al -so /tmp/airbnb/TUR_PTO_AIRBNB_RM_2024.gpkg TUR_PTO_AIRBNB_RM_2024 | awk -F': ' '/Feature Count/{print $2;exit}')
          test "$STGO_COUNT" = "1640"
          test "$RM_COUNT" = "5058"
          ogr2ogr -f GeoJSON -t_srs EPSG:4326 public/data/turismo/airbnb-stgo-2024.geojson /tmp/airbnb/TUR_PTO_AIRBNB_STGO_2024.gpkg TUR_PTO_AIRBNB_STGO_2024
          ogr2ogr -f GeoJSON -t_srs EPSG:4326 public/data/turismo/airbnb-rm-2024.geojson /tmp/airbnb/TUR_PTO_AIRBNB_RM_2024.gpkg TUR_PTO_AIRBNB_RM_2024
          cp /tmp/airbnb/TUR_PTO_AIRBNB_STGO_2024.gpkg public/data/gpkg/
          cp /tmp/airbnb/TUR_PTO_AIRBNB_RM_2024.gpkg public/data/gpkg/
      - name: Integrar visor e indice
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('app/page.tsx'); s=p.read_text()
          s=s.replace('tipoContenedor?:string;subcapa?:string;', 'tipoContenedor?:string;subcapa?:string;gpkgDownload?:string;')
          s=s.replace('function gpkgDownload(i:IndexItem){const c=String(i.contenedor||"");return c.endsWith("_VF.gpkg")?`/data/gpkg/${c}`:""}', 'function gpkgDownload(i:IndexItem){if(i.gpkgDownload)return i.gpkgDownload;const c=String(i.contenedor||"");return c.endsWith("_VF.gpkg")?`/data/gpkg/${c}`:""}')
          marker=' {id:"bibliotecas",name:"Bibliotecas 2025",theme:"SOC",geometry:"Punto",url:`${BASE_PATH}/data/PTO_BIB_2025_001_BIBLIOTECAS_2025.geojson`,color:"#2877a6",description:"Variable temática sociocultural. Se activa desde Herramientas, Índice o SantIA.",source:"Biblioteca Digital"},'
          add='''\n {id:"airbnb-stgo-2024",name:"Airbnb Santiago 2024",theme:"SOC",geometry:"Punto",url:`${BASE_PATH}/data/turismo/airbnb-stgo-2024.geojson`,color:"#8b5a9a",description:"Oferta Airbnb 2024 en la comuna de Santiago.",source:"TUR_PTO_AIRBNB_STGO_2024.gpkg"},\n {id:"airbnb-rm-2024",name:"Airbnb RM 2024",theme:"SOC",geometry:"Punto",url:`${BASE_PATH}/data/turismo/airbnb-rm-2024.geojson`,color:"#5f729b",description:"Cobertura comparativa Airbnb 2024 para la Región Metropolitana.",source:"TUR_PTO_AIRBNB_RM_2024.gpkg"},'''
          if 'id:"airbnb-stgo-2024"' not in s:
              assert marker in s, 'No se encontro ancla bibliotecas para insertar Airbnb'
              s=s.replace(marker,marker+add,1)
          smarker='bibliotecas:{color:"#2877a6",pointRadius:6},'
          if '"airbnb-stgo-2024":' not in s:
              assert smarker in s, 'No se encontro ancla estilos bibliotecas'
              s=s.replace(smarker,smarker+'\n "airbnb-stgo-2024":{color:"#8b5a9a",pointRadius:4},"airbnb-rm-2024":{color:"#5f729b",pointRadius:3},',1)
          p.write_text(s)

          idx=Path('public/catalog/index_coberturas.json'); j=json.loads(idx.read_text())
          items=[x for x in j.get('items',[]) if x.get('id') not in ('airbnb-stgo-2024','airbnb-rm-2024')]
          items += [
            {"id":"airbnb-stgo-2024","mapId":"airbnb-stgo-2024","tema":"SOC","dimensionPladeco":"DIMENSIÓN SOCIOCULTURAL","sector":"Turismo","nombre":"Airbnb Santiago 2024","geometria":"Punto","escala":"Comuna","contenedor":"TUR_PTO_AIRBNB_STGO_2024.gpkg","tipoContenedor":"GeoPackage operativo","subcapa":"TUR_PTO_AIRBNB_STGO_2024","estado":"PUBLICADA","validacion":"VALIDADA PARA VISUALIZACIÓN","registros":1640,"crs":"EPSG:32719 (fuente) / EPSG:4326 (web)","verEnMapa":True,"download":"/data/turismo/airbnb-stgo-2024.geojson","gpkgDownload":"/data/gpkg/TUR_PTO_AIRBNB_STGO_2024.gpkg","observaciones":"Cobertura comunal Airbnb 2024. COD_MZN disponible en fuente."},
            {"id":"airbnb-rm-2024","mapId":"airbnb-rm-2024","tema":"SOC","dimensionPladeco":"DIMENSIÓN SOCIOCULTURAL","sector":"Turismo","nombre":"Airbnb RM 2024","geometria":"Punto","escala":"Región Metropolitana","contenedor":"TUR_PTO_AIRBNB_RM_2024.gpkg","tipoContenedor":"GeoPackage operativo","subcapa":"TUR_PTO_AIRBNB_RM_2024","estado":"PUBLICADA","validacion":"VALIDADA PARA VISUALIZACIÓN","registros":5058,"crs":"EPSG:32719 (fuente) / EPSG:4326 (web)","verEnMapa":True,"download":"/data/turismo/airbnb-rm-2024.geojson","gpkgDownload":"/data/gpkg/TUR_PTO_AIRBNB_RM_2024.gpkg","observaciones":"Cobertura regional comparativa Airbnb 2024."}
          ]
          j['items']=items; j['total']=len(items)
          idx.write_text(json.dumps(j,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Pruebas Airbnb
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p,n in [('public/data/turismo/airbnb-stgo-2024.geojson',1640),('public/data/turismo/airbnb-rm-2024.geojson',5058)]:
            j=json.loads(Path(p).read_text()); assert len(j['features'])==n,(p,len(j['features']))
          idx=json.loads(Path('public/catalog/index_coberturas.json').read_text())
          ids={x['id'] for x in idx['items']}; assert {'airbnb-stgo-2024','airbnb-rm-2024'}<=ids
          s=Path('app/page.tsx').read_text(); assert 'id:"airbnb-stgo-2024"' in s and 'id:"airbnb-rm-2024"' in s
          print('Airbnb STGO/RM OK; indice',idx['total'])
          PY
          npm ci
          npx next build --webpack
      - name: Guardar carga Airbnb
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx public/data/turismo public/data/gpkg/TUR_PTO_AIRBNB_STGO_2024.gpkg public/data/gpkg/TUR_PTO_AIRBNB_RM_2024.gpkg public/catalog/index_coberturas.json
          git commit -m 'Visor: cargar Airbnb Santiago y RM 2024' || exit 0
          git push
