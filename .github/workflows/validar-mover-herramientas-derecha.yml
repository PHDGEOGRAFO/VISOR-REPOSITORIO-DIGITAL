name: Validar movimiento herramientas derecha

on:
  push:
    branches:
      - fix/mover-herramientas-columna-derecha

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vinext build
