name: Correcciones KISS herramientas y descarga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correcciones-kiss-herramientas-descarga.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar correcciones KISS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/page.tsx')
          s=p.read_text()

          # 1) Unificar Selección + Análisis si todavía están separados
          s=s.replace('<div className="selectionBlock"><b>1. Selección espacial</b>', '<div className="selectionBlock"><b>1. Selección y análisis</b>')
          s=s.replace('</div><div className="analysisBlock"><b>2. Análisis sobre la selección</b><label>Tipo de análisis<select value={analysis} onChange={e=>setAnalysis(e.target.value)}>', '<div className="analysisInline"><label>Tipo de análisis<select value={analysis} onChange={e=>setAnalysis(e.target.value)}>')
          s=s.replace('</select></label></div><div className="visualBlock"><b>3. Visualización / capas independientes</b>', '</select></label></div></div><div className="visualBlock"><b>2. Visualización / capas independientes</b>')

          # 2) Hacer explícito que el botón es descarga de datos
          s=s.replace('>Descargar</a>', '>Descargar datos</a>')
          s=s.replace('>Descargar</button>', '>Descargar datos</button>')

          # 3) Explicación en la propia columna/casilla de acciones del índice
          if '<th>ACCIONES</th>' in s:
              s=s.replace('<th>ACCIONES</th>', '<th>ACCIONES<small className="downloadHeaderHelp">Seleccionar = mostrar en mapa · Descargar datos = formatos disponibles</small></th>',1)
          elif '<th>Acciones</th>' in s:
              s=s.replace('<th>Acciones</th>', '<th>Acciones<small className="downloadHeaderHelp">Seleccionar = mostrar en mapa · Descargar datos = formatos disponibles</small></th>',1)

          # 4) Añadir texto aclaratorio junto a cada enlace de descarga cuando sea posible.
          # Se añade solo si aún no existe la ayuda para evitar duplicados.
          if 'downloadFormatsHelp' not in s:
              # localizar la primera celda de acciones que contenga descarga y añadir ayuda después del enlace/botón
              patterns=[
                  r'(<a[^>]+href=\{[^}]*download[^}]*\}[^>]*>Descargar datos</a>)',
                  r'(<a[^>]+download[^>]*>Descargar datos</a>)'
              ]
              for pat in patterns:
                  ns,n=re.subn(pat, r'\1<small className="downloadFormatsHelp"><b>GPKG</b>: GIS recomendado · <b>CSV</b>: tabla/atributos · <b>GeoJSON</b>: web/intercambio. Se muestran solo los formatos disponibles.</small>', s, count=1)
                  if n:
                      s=ns
                      break

          p.write_text(s)
          PY

      - name: Ajustar estilos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/globals.css')
          s=p.read_text()
          css='''\n.analysisInline{margin-top:9px;padding-top:8px;border-top:1px solid #c9d3df}.analysisInline label{display:block;color:#435263;font-size:10px!important;font-weight:600}.analysisInline select{display:block;width:100%;margin-top:4px;padding:8px;border:1px solid #afbdcd;background:#fff;font-size:10px!important}.downloadHeaderHelp{display:block;margin-top:4px;font-size:8px;line-height:1.25;font-weight:400;text-transform:none;max-width:230px}.downloadFormatsHelp{display:block;margin-top:5px;font-size:8px;line-height:1.3;color:#425268;max-width:220px}.downloadFormatsHelp b{color:#123d77}\n'''
          if '.downloadFormatsHelp' not in s:
              s += css
          p.write_text(s)
          PY

      - name: Validar build
        run: |
          npm ci
          npx next build --webpack

      - name: Guardar correcciones
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/globals.css
          git commit -m 'Visor: unificar análisis y explicar descargas' || exit 0
          git push
