name: Reparar y preparar Visor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-release.yml'

permissions:
  contents: write

concurrency:
  group: repair-visor
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir cargador de capas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text(encoding='utf-8')
          start=s.find(' useEffect(()=>{layers.forEach')
          end=s.find(' useEffect(()=>{if(analysis!=="Isócronas"',start)
          if start<0 or end<0:
              raise SystemExit(f'Marcadores no encontrados: start={start}, end={end}')
          block=''' useEffect(()=>{\n  layers.forEach(layer=>{\n   if(data[layer.id]&&!(layer.populationJoin&&Object.keys(population).length))return;\n   if(status[layer.id]==="cargando")return;\n   setStatus(s=>({...s,[layer.id]:"cargando"}));\n   fetch(layer.url)\n    .then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()})\n    .then((fc:GeoCollection)=>{\n     let clean=fc;\n     if(layer.id==="lineas-prc")clean={...fc,features:fc.features.filter(f=>f.geometry.type==="LineString"||f.geometry.type==="MultiLineString")};\n     if(layer.populationJoin)clean={...clean,features:clean.features.map(f=>{const p={...f.properties},cod=String(p.COD_MZN??p.cod_mzn??"");p.COD_MZN=cod;p.n_per=population[cod]??p.n_per??p.POBLACION??null;return{...f,properties:p}})};\n     setData(d=>({...d,[layer.id]:clean}));\n     setStatus(s=>({...s,[layer.id]:"ok"}));\n    })\n    .catch(()=>setStatus(s=>({...s,[layer.id]:"error"})));\n  });\n },[population]);\n'''
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
          print('Bloque de carga reemplazado correctamente')
          PY
      - name: Expandir inventario completo Biblioteca Digital
        run: |
          gzip -dc public/catalog/index_coberturas_full.json.gz > public/catalog/index_coberturas.json
          python - <<'PY'
          import json
          p=json.load(open('public/catalog/index_coberturas.json',encoding='utf-8'))
          n=len(p.get('items',[]))
          assert n>=900, f'Inventario incompleto: {n}'
          print('Coberturas publicadas en índice:',n)
          PY
      - name: Guardar reparación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx public/catalog/index_coberturas.json
          git commit -m "Visor: corregir carga y publicar catálogo completo Biblioteca Digital"
          git push
