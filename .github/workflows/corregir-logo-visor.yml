name: Corregir logo del visor

on:
  push:
    branches: [main]
    paths:
      - 'public/logo-munistgo-fallback.svg'
      - '.github/workflows/corregir-logo-visor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir carga del logo
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text(encoding='utf-8')
          old='${BASE_PATH}/logo-munistgo-fallback.svg'
          new='${BASE_PATH}/logo-munistgo.png'
          n=s.count(old)
          if n:
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
              print(f'Logo oficial aplicado en {n} referencia(s)')
          else:
              print('Logo oficial ya estaba aplicado; no hay cambios')
      - name: Validar build
        run: |
          npm ci
          npx next build --webpack
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Visor: usar logo municipal oficial"
          git push
