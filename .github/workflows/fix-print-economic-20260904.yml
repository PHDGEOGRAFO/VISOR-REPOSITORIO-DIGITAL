name: Corregir impresion completa y dimension economica

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-print-economic-20260904.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir conteo economico e impresion
        run: |
          python - <<'PY'
          from pathlib import Path

          page=Path('app/page.tsx')
          s=page.read_text(encoding='utf-8')
          old='function itemDimension(i:IndexItem){return (i as any).dimensionPladeco||"POR CLASIFICAR"}'
          new='function itemDimension(i:IndexItem){return String((i as any).dimensionPladeco||"POR CLASIFICAR").replace("DIMENSIÓN ECONÓMICA","DIMENSIÓN ECONOMICA")}'
          if old in s:
              s=s.replace(old,new,1)
          page.write_text(s,encoding='utf-8')

          css=Path('app/globals.css')
          c=css.read_text(encoding='utf-8')
          marker='/* PRINT_COMPLETO_20260904 */'
          if marker not in c:
              c += r'''

/* PRINT_COMPLETO_20260904 */
@media print{
  @page{size:Letter landscape;margin:5mm}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body>*{display:none!important}body>main{display:block!important}
  main>header,.sidebar,.layerControl,.zoomControl,.mapAttribution,.topActions,.santiPanel,.legacyTools,.selectionButtons,.toolButtons,.clearSelection,.downloadAuthBackdrop,.indexBackdrop{display:none!important}
  .workspace{display:grid!important;grid-template-columns:minmax(0,1fr) 70mm!important;gap:3mm!important;height:auto!important;min-height:0!important;align-items:start!important}
  .map{display:block!important;position:relative!important;width:auto!important;height:190mm!important;overflow:hidden!important;border:1px solid #697671!important;background:#eef0ed!important;page-break-inside:avoid!important;break-inside:avoid!important}
  .interactiveMap{display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;overflow:hidden!important}
  .interactiveMap>svg{display:block!important;width:100%!important;height:100%!important}
  .analysisTools{display:block!important;position:absolute!important;z-index:30!important;right:4mm!important;top:4mm!important;width:61mm!important;max-height:105mm!important;overflow:hidden!important;padding:2.5mm!important;background:#fffffff2!important;border:1px solid #9aa7a1!important;box-shadow:none!important;font-size:6.5pt!important}
  .analysisTools>b{font-size:7.5pt!important}.analysisTools label,.analysisTools small,.analysisTools select,.analysisTools .analysisResult strong{font-size:6.2pt!important;line-height:1.25!important}
  .analysisTools select{padding:1mm!important;background:#fff!important;border:1px solid #aeb7b2!important;color:#172c26!important}
  .analysisTools .disaggregateControl{padding:1.5mm!important;margin-top:1mm!important}.analysisTools .categorySummary{gap:.7mm!important}.analysisTools .categorySummary span{font-size:5.8pt!important}
  .visualBlock{display:none!important}
  .inspector{display:block!important;position:static!important;width:auto!important;height:190mm!important;overflow:hidden!important;padding:3mm!important;background:#fff!important;border:1px solid #aeb7b2!important;font-size:7pt!important}
  .inspector>.kicker,.featureDetails .kicker{font-size:6.5pt!important;margin:0 0 2mm!important}.inspector .title{padding-bottom:2mm!important}.inspector .title h2{font-size:13pt!important;margin:0 0 1mm!important}.inspector .title p,.inspector>p{font-size:7pt!important;line-height:1.35!important}.inspector .summary{padding:2mm 0!important;display:grid!important;gap:1.5mm!important}.inspector .summary div{padding:2mm!important;margin:0!important;font-size:6.8pt!important}.inspector .summary b{font-size:12pt!important}.featureDetails{margin-top:2mm!important}.featureDetails p{display:grid!important;grid-template-columns:26mm 1fr!important;gap:1mm!important;margin:0!important;padding:1.1mm 0!important;border-bottom:1px solid #e1e5e2!important}.featureDetails strong,.featureDetails span{font-size:6.2pt!important;line-height:1.25!important;overflow-wrap:anywhere!important}
  .printMapDecor{display:block!important}
  .printLegend{max-width:65mm!important;max-height:72mm!important}
  .printAnalysisState{display:none!important}
  .printSource{font-size:5.8pt!important}
  .osmTiles image{opacity:1!important}
}
'''
              css.write_text(c,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name 'PHDGEOGRAFO'
          git config user.email 'phernandezd@gmail.com'
          git add app/page.tsx app/globals.css
          git commit -m 'Visor: imprimir mapa, analisis y datos laterales; corregir ECO' || exit 0
          git push
