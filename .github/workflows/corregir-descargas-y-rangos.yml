name: Corregir descargas VF y rangos

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/corregir-descargas-y-rangos.yml'
      - 'scripts/corregir_descargas_rangos.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar correcciones
        run: python scripts/corregir_descargas_rangos.py
      - name: Validar build
        run: |
          npm ci
          npx next build --webpack
      - name: Guardar correcciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "Visor: descargas VF robustas y rangos de desagregacion" || exit 0
          git push
